spring.application.name=sb-ecom
server.port=${PORT:8080}

# PostgreSQL configuration. Set SPRING_DATASOURCE_PASSWORD in your environment.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecomdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 console is only available when using H2.
spring.h2.console.enabled=false

project.image=images/

spring.app.jwtSecret=${JWT_SECRET:mySecretKey123912738aopsgjnspkmndfsopkvajoirjg94gf2opfng2moknm}
spring.app.jwtExpirationMs=300000000
spring.ecom.app.jwtCookieName=springBootEcom

frontend.url=${FRONTEND_URL:http://localhost:5173}
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}

# STRIPE KEY
stripe.secret.key=${STRIPE_SECRET_KEY:}
